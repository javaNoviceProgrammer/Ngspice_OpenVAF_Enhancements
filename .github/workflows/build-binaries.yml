name: Build binaries

# Builds ngspice and openvaf-r natively on each platform and drops the
# resulting binaries into bin/<os>/<arch>/.  Native runners are used per
# target so each build links against its own LLVM 18 — no cross-compilation.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'bin/**'        # binary commits made by this workflow must not retrigger it
      - '**/*.md'

permissions:
  contents: write       # the collect job commits binaries back into bin/

# Only one build per branch at a time: a new push cancels the older,
# now-superseded run. Without this, rapid pushes pile up runs that each queue a
# macOS runner, so those jobs never get scheduled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENVAF_DIR: OpenVAF-master-20260610
  NGSPICE_DIR: ngspice-46

jobs:
  # ------------------------------------------------------------------ Unix
  build-unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The Linux legs build inside an ubuntu:22.04 (jammy) container so the
    # binaries link against glibc 2.35 instead of the 24.04 runner's 2.39;
    # built on the bare runner they refuse to start on any distro older than
    # Ubuntu 24.04 ("version `GLIBC_2.39' not found"). Jammy-built binaries
    # run on Ubuntu 22.04+ / Debian 12+. macOS entries leave `container`
    # unset, which GitHub treats as "no container".
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-intel,         os: ubuntu-latest,    container: "ubuntu:22.04", bin: linux/intel }
          - { name: linux-arm,           os: ubuntu-24.04-arm, container: "ubuntu:22.04", bin: linux/arm }
          - { name: macos-apple-silicon, os: macos-14,         bin: macos/apple-silicon }
          # macos-13 (the old Intel-macOS image) was scarce/deprecated and never
          # got scheduled, which used to stall the whole matrix. macos-26-intel
          # (macOS 26 "Tahoe" on Intel, still in beta as of writing) is the
          # current standard-tier Intel macOS image, so Intel is back in the
          # matrix -- see https://github.com/actions/runner-images/issues/13637.
          # NOTE: GitHub has signaled Intel macOS runners will be retired
          # entirely in 2027 (Apple Silicon-only after that) -- this leg will
          # need to be dropped again around then, this time for good.
          - { name: macos-intel,         os: macos-26-intel,   bin: macos/intel }
    steps:
      # The jammy container starts bare (no git, no CA certs); install git
      # before checkout so actions/checkout does a real git clone rather than
      # falling back to the REST-API tarball download.
      - name: Prepare container (Linux)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          # Jammy has no distro LLVM 18, so it comes from apt.llvm.org. (The
          # earlier reason for avoiding apt.llvm.org -- arm64 package conflicts
          # -- was specific to noble's own llvm packages and does not apply on
          # jammy.) Running as root inside the container, hence no sudo.
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl wget gnupg \
            build-essential automake autoconf libtool bison flex pkg-config \
            zlib1g-dev libzstd-dev libtinfo-dev libxml2-dev \
            libreadline-dev libx11-dev libxaw7-dev libxft-dev libxext-dev libxmu-dev libxt-dev
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/apt-llvm-org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm-org.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            > /etc/apt/sources.list.d/llvm18.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            llvm-18 llvm-18-dev libclang-18-dev clang-18 libpolly-18-dev
          PREFIX="$(llvm-config-18 --prefix)"
          echo "LLVM_SYS_181_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          # The openvaf 'target' crate build.rs invokes clang + llvm-lib, so the
          # LLVM bin dir must be on PATH (mirrors what build.sh does locally).
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          # Build ngspice with X (Xaw plotting) and readline support.
          echo "NGSPICE_XREADLINE=--with-x --with-readline=yes" >> "$GITHUB_ENV"

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          # Silence two CI warnings from the runner image: it ships an
          # untrusted third-party tap (aws/tap) that brew now warns about,
          # and a pre-installed LLVM (llvm@15 on macos-14, llvm@20 on
          # macos-26-intel -- varies by image), which makes the llvm@18
          # install warn "installed but not linked" (brew's check is on
          # INSTALLED versions, so a mere unlink is not enough -- remove
          # every non-18 llvm). None of this is used by the build: openvaf
          # gets LLVM 18 via LLVM_SYS_181_PREFIX + PATH below, and ngspice
          # builds with Apple's /usr/bin/clang.
          brew untap aws/tap 2>/dev/null || true
          for f in $(brew list --formula 2>/dev/null | grep '^llvm' | grep -v '^llvm@18$'); do
            brew uninstall --ignore-dependencies "$f" 2>/dev/null || true
          done
          brew update
          brew install llvm@18 automake autoconf libtool bison flex readline ncurses
          # belt-and-braces: make llvm@18 the linked default too (the build
          # does not depend on the link, but this keeps any brew-installed
          # tool that looks for a linked llvm consistent with what we use)
          brew link --overwrite llvm@18 2>/dev/null || true
          # XQuartz provides the X11 headers/libs at /opt/X11 for --with-x.
          brew install --cask xquartz
          PREFIX="$(brew --prefix llvm@18)"
          echo "LLVM_SYS_181_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          # LLVM bin first on PATH so 'clang'/'llvm-lib' resolve to LLVM 18
          # (needed by the openvaf 'target' crate build.rs).
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          # Build ngspice with X (XQuartz at /opt/X11) and readline. readline is
          # keg-only and needs a terminfo provider (ncurses, also keg-only), so
          # expose both via CPPFLAGS/LDFLAGS env vars (these tolerate the spaces
          # that a configure-arg word-split would not).
          RL="$(brew --prefix readline)"; NC="$(brew --prefix ncurses)"
          echo "NGSPICE_XREADLINE=--with-x --x-includes=/opt/X11/include --x-libraries=/opt/X11/lib --with-readline=yes" >> "$GITHUB_ENV"
          # /opt/X11 must be on the general CPPFLAGS/LDFLAGS too: --with-x adds
          # -lfreetype/-lfontconfig (which live in /opt/X11/lib) to LIBS, and
          # without that -L the readline tgetent/termcap link check fails to
          # link at all -> "Found neither ncurses/terminfo or termcap".
          # -I/opt/X11/include/freetype2 is needed because the X11 plotting code
          # includes <X11/Xft/Xft.h>, which pulls in freetype's <ft2build.h>.
          echo "CPPFLAGS=-I$RL/include -I$NC/include -I/opt/X11/include -I/opt/X11/include/freetype2" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$RL/lib -L$NC/lib -L/opt/X11/lib" >> "$GITHUB_ENV"
          # Build ngspice with Apple's clang (full macOS SDK + system libs such
          # as ncurses/termcap); the Homebrew LLVM clang on PATH (used by
          # openvaf) does not resolve the SDK system-library stubs, which breaks
          # readline's tgetent/terminfo link check.
          echo "NGSPICE_CC=CC=/usr/bin/clang CXX=/usr/bin/clang++" >> "$GITHUB_ENV"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.OPENVAF_DIR }}/target
          # 'jammy'/'host' keeps container builds from restoring a target/
          # full of noble-built (glibc 2.39) objects that cargo would happily
          # relink without recompiling.
          key: cargo-${{ matrix.name }}-${{ matrix.container && 'jammy' || 'host' }}-${{ hashFiles(format('{0}/Cargo.lock', env.OPENVAF_DIR)) }}
          restore-keys: cargo-${{ matrix.name }}-${{ matrix.container && 'jammy' || 'host' }}-

      - name: Build openvaf-r
        working-directory: ${{ env.OPENVAF_DIR }}
        run: cargo build --release --features llvm18 --bin openvaf-r

      - name: Build ngspice
        working-directory: ${{ env.NGSPICE_DIR }}
        run: |
          ./autogen.sh
          mkdir -p ci-build && cd ci-build
          # $NGSPICE_XREADLINE carries --with-x / --with-readline (per platform);
          # $NGSPICE_CC pins the compiler on macOS (empty on Linux).
          ../configure --disable-debug --enable-klu --disable-openmp $NGSPICE_CC $NGSPICE_XREADLINE \
            || { echo "===== config.log: termcap/readline detection ====="; \
                 grep -iE 'tputs|tgetent|termcap|terminfo|ncurses|readline' config.log | tail -60; \
                 echo "===== config.log (tail) ====="; tail -60 config.log; exit 1; }
          make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Stage binaries
        run: |
          mkdir -p "out/bin/${{ matrix.bin }}"
          cp "$OPENVAF_DIR/target/release/openvaf-r" "out/bin/${{ matrix.bin }}/"
          cp "$NGSPICE_DIR/ci-build/src/ngspice"     "out/bin/${{ matrix.bin }}/"
          # Strip debug symbols before committing. Unstripped, openvaf-r carries
          # ~90 MB of embedded DWARF on Linux (~100 MB total), which exceeds
          # GitHub's 100 MB hard file-size limit and gets the whole binary-commit
          # push rejected by the pre-receive hook. Stripped it is ~10-15 MB.
          # (macOS needs -x to strip an executable's local symbols in place.)
          if [ "${{ runner.os }}" = "macOS" ]; then STRIP_ARGS="-x"; else STRIP_ARGS=""; fi
          strip $STRIP_ARGS "out/bin/${{ matrix.bin }}/openvaf-r" || true
          strip $STRIP_ARGS "out/bin/${{ matrix.bin }}/ngspice"   || true
          chmod +x "out/bin/${{ matrix.bin }}/"*
          ls -lh "out/bin/${{ matrix.bin }}/"
          # Portability guard: fail the build if either binary picked up a
          # glibc symbol newer than jammy's 2.35 (i.e. if the container setup
          # ever silently stops taking effect).
          if [ "${{ runner.os }}" = "Linux" ]; then
            MAX="$(objdump -T out/bin/${{ matrix.bin }}/openvaf-r out/bin/${{ matrix.bin }}/ngspice \
                   | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)"
            echo "max glibc symbol version required: $MAX"
            if [ "$(printf '%s\n' "$MAX" GLIBC_2.35 | sort -V | tail -1)" != "GLIBC_2.35" ]; then
              echo "::error::binaries require $MAX > 2.35 -- not portable to Ubuntu 22.04"
              exit 1
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  # --------------------------------------------------------------- Windows
  # ngspice builds via MSYS2/MinGW. openvaf-r builds with the NATIVE MSVC
  # toolchain against LLVM 18 (official GitHub release tarball).
  build-windows:
    name: windows-intel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git autoconf automake libtool bison flex
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-readline

      - name: Build ngspice (MSYS2/MinGW)
        shell: msys2 {0}
        working-directory: ${{ env.NGSPICE_DIR }}
        run: |
          ./autogen.sh
          mkdir -p ci-build && cd ci-build
          ../configure --disable-debug --enable-klu --disable-openmp --with-readline=yes --without-x
          make -j"$(nproc)"

      - name: Bundle ngspice + MinGW DLLs
        shell: msys2 {0}
        run: |
          mkdir -p out/bin/windows/intel
          cp "$NGSPICE_DIR/ci-build/src/ngspice.exe" out/bin/windows/intel/
          # libtool does not honour -static for executables reliably on MinGW.
          # Instead, find every non-Windows DLL dependency with ldd and copy
          # them alongside the .exe so the binary runs without MSYS2 installed.
          ldd "out/bin/windows/intel/ngspice.exe" \
            | grep -iv '/c/windows\|/C/Windows\|not found' \
            | awk '{print $3}' | grep -v '^$' \
            | xargs -I{} cp -n {} out/bin/windows/intel/ 2>/dev/null || true
          echo "=== Bundled files ==="
          ls -lh out/bin/windows/intel/

      - name: Install LLVM 18 dev tarball (official GitHub release)
        shell: pwsh
        run: |
          # The Chocolatey LLVM package omits the static .lib files that
          # llvm-sys-181 needs to link (~100 LLVM*.lib).  The official
          # clang+llvm tarball from the LLVM GitHub release page includes
          # everything: headers, llvm-config.exe, and all static libs.
          $url    = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz"
          $out    = "$env:RUNNER_TEMP\llvm18.tar.xz"
          $prefix = "C:\llvm18"
          Write-Host "Downloading LLVM 18.1.8 dev tarball (~700 MB)..."
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Write-Host "Extracting..."
          # tar on Windows 10+ (bsdtar) understands .tar.xz natively
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          tar -xf $out -C $prefix --strip-components=1
          "LLVM_SYS_181_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$prefix\bin"                 | Out-File -FilePath $env:GITHUB_PATH -Append
          # Diagnostics
          if (Test-Path "$prefix\bin\llvm-config.exe") {
            Write-Host "llvm-config version: $(& "$prefix\bin\llvm-config.exe" --version)"
          } else { Write-Host "WARNING: llvm-config.exe not found" }
          $libs = (Get-ChildItem "$prefix\lib\LLVM*.lib" -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "LLVM*.lib files in lib/: $libs"

      - name: Install libxml2 static (vcpkg, required by LLVM 18 linker)
        shell: pwsh
        run: |
          # LLVM 18's llvm-config --system-libs emits libxml2s.lib on Windows.
          # vcpkg (pre-installed on GitHub runners) provides this via its
          # x64-windows-static triplet, which names the static output libxml2s.lib.
          vcpkg install libxml2:x64-windows-static
          $lib = "C:\vcpkg\installed\x64-windows-static\lib"
          Write-Host "vcpkg lib contents:"
          Get-ChildItem $lib -Filter "*xml*" -ErrorAction SilentlyContinue
          # vcpkg names it libxml2.lib; LLVM 18's llvm-config --system-libs asks
          # for libxml2s.lib (the 's' = static convention used by LLVM's CMake).
          # Copy it under the expected name so the Rust linker finds it.
          if (Test-Path "$lib\libxml2.lib") {
            Copy-Item "$lib\libxml2.lib" "$lib\libxml2s.lib"
            Write-Host "Created libxml2s.lib alias"
          }
          # Expose to both the compiler and the Rust linker via the LIB search path
          "LIB=$env:LIB;$lib" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build openvaf-r (MSVC + LLVM 18)
        shell: pwsh
        working-directory: ${{ env.OPENVAF_DIR }}
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          clang --version
          cargo build --release --features llvm18 --bin openvaf-r

      - name: Stage openvaf-r.exe
        shell: pwsh
        run: |
          # ngspice.exe + its DLLs were already staged by the MSYS2 bundle step.
          # Add openvaf-r.exe if the build succeeded.
          Copy-Item "$env:OPENVAF_DIR\target\release\openvaf-r.exe" out\bin\windows\intel\ -ErrorAction SilentlyContinue
          Write-Host "=== Final bin/windows/intel contents ==="
          Get-ChildItem out\bin\windows\intel\

      - name: Strip Windows binaries
        shell: msys2 {0}
        run: |
          # Strip debug/symbol data for consistency with the other platforms.
          # openvaf-r.exe is MSVC-built but PE/COFF, which GNU strip (via MSYS2)
          # understands; ngspice.exe + the bundled MinGW DLLs are MinGW-built.
          # Windows keeps debug info in a separate .pdb so this mainly trims the
          # COFF symbol table, but it costs nothing and keeps the .exe lean.
          for f in out/bin/windows/intel/*.exe out/bin/windows/intel/*.dll; do
            [ -f "$f" ] && strip --strip-all "$f" 2>/dev/null || true
          done
          echo "=== stripped bin/windows/intel ==="
          ls -lh out/bin/windows/intel/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bin-windows-intel
          path: out/
          if-no-files-found: warn

  # ---------------------------------------------------------------- Collect
  # Download every platform's artifact and commit the binaries into bin/.
  collect:
    name: Commit binaries to bin/
    needs: [build-unix, build-windows]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # Pull artifacts from EVERY build job that succeeded this run. Only the
      # jobs that finished green uploaded an artifact, so whatever lands here is
      # exactly the set of platforms that built — partial runs are fine.
      # merge-multiple combines each platform's bin/<os>/<arch> tree into one.
      - name: Download successful platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: _artifacts
          merge-multiple: true
        continue-on-error: true   # don't fail if a run produced zero artifacts

      - name: Stage binaries from successful platforms
        run: |
          if [ ! -d _artifacts/bin ]; then
            echo "No platform produced binaries this run — nothing to commit."
            exit 0
          fi
          cp -R _artifacts/bin/. bin/
          echo "Binaries provided by the platforms that built successfully:"
          find _artifacts/bin -type f | sed 's#_artifacts/##; s/^/  /'

      - name: Commit & push
        run: |
          if [ -z "$(git status --porcelain bin/)" ]; then
            echo "No binary changes to commit (successful platforms already up to date)."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/
          git commit -m "ci: update prebuilt binaries [skip ci]"
          # rebase on any concurrent change, then push the successful binaries
          git pull --rebase --autostash origin main
          git push origin main
          echo "Pushed updated binaries for the platforms that built."
